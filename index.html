<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9B193B">
<title>Discussion</title>
<style>
  :root{ --bg:#faf5f2; --card:#fff; --accent:#9B193B; --accent2:#c23a5e; --txt:#2a2024; --muted:#8a7f84; }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ --bg:#1a1114; --card:#241a1e; --txt:#f3e9ec; --muted:#b59aa3; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--txt);
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .card{
    background:var(--card); border-radius:28px; padding:44px 30px;
    max-width:420px; width:100%;
    box-shadow:0 20px 60px rgba(155,25,59,.14);
  }
  .logo{
    width:96px;height:96px;border-radius:28px;margin:0 auto 22px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-size:46px; box-shadow:0 10px 28px rgba(155,25,59,.35);
  }
  h1{margin:0 0 8px;font-size:26px;letter-spacing:.3px}
  p{margin:0 0 6px;color:var(--muted);line-height:1.5;font-size:15px}
  .dots{margin:26px 0 4px;display:flex;gap:8px;justify-content:center}
  .dots span{
    width:10px;height:10px;border-radius:50%;background:var(--accent);
    opacity:.3;animation:b 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
  .foot{margin-top:24px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">💬</div>
    <h1>Discussion</h1>
    <p>Votre messagerie privée à deux.</p>
    <p>L'application arrive ici très bientôt.</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="foot">Bollywood · privé</div>
  </div>
</body>
</html>
